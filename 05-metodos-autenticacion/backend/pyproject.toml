[project]
name = "05-metodos-autenticacion-backend"
version = "0.1.0"
description = "Comparativa de metodos de autenticacion: Basic, Session, Token, JWT, Cookie, OAuth2 y SSO"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
[project]
name = "06-autorizacion-rbac-backend"
version = "0.1.0"
description = "Autorizacion RBAC: roles (admin/editor/viewer), object-level access control, scopes y multi-tenancy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.1.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]